
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NOVA HQ 8.3 — More Alive Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b29;color:#eaf4ff;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;z-index:1}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.panel{position:fixed;z-index:5;background:rgba(7,17,30,.88);border:1px solid #42617b;border-radius:12px;backdrop-filter:blur(8px)}
#topbar{top:10px;left:10px;right:10px;padding:11px;display:flex;justify-content:space-between;padding-top:calc(11px + env(safe-area-inset-top,0px))}
.logo{font-size:17px;letter-spacing:2px;color:#8edaff;font-weight:bold}
.small{font-size:10px;color:#a9bdce;margin-top:4px}
.status{font-size:10px;color:#7ef0bb;text-align:right}
#dashboard{top:85px;left:10px;width:170px;padding:12px;display:none}
.heading{font-size:12px;color:#8edaff;margin-bottom:8px;font-weight:bold}
.metric{font-size:10px;margin:9px 0 4px;color:#b6c8d8}
.bar{height:5px;background:#26394c;border-radius:8px;overflow:hidden}
.fill{height:100%;background:#4cbce9;width:40%;transition:width .8s}
#chat{right:10px;bottom:70px;width:min(310px,calc(100% - 20px));height:300px;display:none;flex-direction:column;overflow:hidden}
.chatHead{padding:10px;border-bottom:1px solid #ffffff25;display:flex;justify-content:space-between}
#messages{padding:10px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{font-size:12px;line-height:1.5;padding:9px 11px;border-radius:10px;max-width:90%}
.bot{background:#18364d;align-self:flex-start}
.user{background:#075b75;align-self:flex-end}
.chatInput{display:flex;padding:8px;gap:6px;border-top:1px solid #ffffff25}
input{min-width:0;flex:1;background:#0b1a2a;color:#fff;border:1px solid #46617a;border-radius:8px;padding:9px;font-size:16px}
button{background:#12334d;color:#fff;border:1px solid #4c7796;border-radius:8px;padding:8px 10px;font-size:11px}
button:active{background:#17618a}
#controls{bottom:12px;left:10px;right:10px;display:flex;gap:5px;padding:7px;overflow-x:auto;white-space:nowrap}
#controls button{flex:0 0 auto}#controls button.novaPresence{border-color:#63d9ff;color:#a9edff;box-shadow:0 0 10px rgba(70,190,255,.18)}
#hint{top:80px;left:50%;transform:translateX(-50%);padding:7px 10px;font-size:10px;white-space:nowrap}
#miniDock{position:fixed;z-index:20;right:10px;top:calc(72px + env(safe-area-inset-top,0px));display:flex;gap:5px}
#miniDock button{background:#10283b}
#movePanel{position:fixed;z-index:8;left:10px;bottom:70px;display:grid;grid-template-columns:38px 38px 38px;gap:4px}
#movePanel button{padding:10px 3px}
#toast{position:fixed;z-index:30;top:120px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#12334d;border:1px solid #579ac2;border-radius:8px;font-size:11px;display:none}
#errorBox{position:fixed;z-index:50;left:12px;right:12px;top:35%;padding:16px;background:#421c25;border:1px solid #ff7777;border-radius:12px;display:none;font-size:13px;line-height:1.6}
body.hud-hidden #topbar,body.hud-hidden #dashboard,body.hud-hidden #chat,body.hud-hidden #controls,body.hud-hidden #hint,body.hud-hidden #movePanel{display:none!important}
body.hud-hidden #miniDock{top:auto;bottom:12px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="vig"></div>
<div id="topbar" class="panel">
 <div><div class="logo">NOVA HEADQUARTERS</div><div class="small">VIRTUAL ENVIRONMENT · 8.3</div></div>
 <div class="status">● SYSTEM ONLINE<div class="small" id="clockTxt">DEMO MODE</div></div>
</div>
<div id="dashboard" class="panel">
 <div class="heading">SYSTEM DASHBOARD</div>
 <div class="metric">CPU <span id="cpuText">35%</span></div><div class="bar"><div class="fill" id="cpuBar"></div></div>
 <div class="metric">MEMORY <span id="memText">48%</span></div><div class="bar"><div class="fill" id="memBar"></div></div>
 <div class="metric">NETWORK <span id="netText">120</span> Mbps</div><div class="bar"><div class="fill" id="netBar"></div></div>
 <div class="small">Simulated demo values</div>
</div>
<div id="chat" class="panel">
 <div class="chatHead"><div><b style="color:#8edaff">NOVA AI</b><div class="small">DEMO CHAT · NOT LIVE CONNECTED</div></div><button onclick="toggleChat(false)">✕</button></div>
 <div id="messages"><div class="msg bot">হ্যালো! NOVA HQ-তে স্বাগতম। 👋</div></div>
 <div class="chatInput"><input id="chatInput" placeholder="এখানে লিখুন..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">SEND</button></div>
</div>
<div id="controls" class="panel">
 <button onclick="goLobby()">LOBBY</button><button onclick="goReception()">RECEPTION</button>
 <button onclick="goDesks()">WORKSPACE</button><button onclick="cityView()">CITY VIEW</button><button class="novaPresence" onclick="focusNOVA()">NOVA PRESENCE</button>
 <button onclick="toggleDay()">DAY/NIGHT</button><button onclick="toggleLights()">LIGHTS</button><button onclick="resetView()">RESET</button>
</div>
<div id="hint" class="panel">আঙুল দিয়ে টেনে চারপাশ দেখুন</div>
<div id="miniDock"><button onclick="toggleHUD()">HUD</button><button onclick="toggleChat()">CHAT</button><button onclick="toggleDash()">DASH</button></div>
<div id="movePanel">
 <span></span><button onclick="walk(.6,0)">▲</button><span></span>
 <button onclick="walk(0,-.6)">◀</button><button onclick="walk(-.6,0)">▼</button><button onclick="walk(0,.6)">▶</button>
</div>
<div id="toast"></div>
<div id="errorBox"></div>

<script>
function showError(m){const e=document.getElementById("errorBox");e.style.display="block";e.innerHTML="<b>3D চালু করা যায়নি</b><br>"+m+"<br><br>ইন্টারনেট সংযোগ পরীক্ষা করে পেজটি Reload করো."}
function loadThree(u,i){
 if(i>=u.length){showError("Three.js লাইব্রেরি লোড হয়নি।");return}
 const s=document.createElement("script");s.src=u[i];
 s.onload=()=>{try{startNOVA()}catch(e){showError(e.message)}};
 s.onerror=()=>loadThree(u,i+1);document.head.appendChild(s);
}
loadThree(["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js","https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"],0);

let camera,scene3,renderer,yaw=0,pitch=0,mainLight,blueLight,sun,hemi,ring1,ring2,core,cur;
let novaAvatar,novaAura,novaHalo,novaLight,novaActive=false;
let novaEyes=[],novaMouth,novaArmL,novaArmR,novaSpeakingUntil=0;
let isDay=false,lightsOn=true,dragging=false,lastX=0,lastY=0,clockCtx,clockTex,lastSec=-1;
let fpsFrames=0,fpsStamp=0,lowFpsCount=0;
const ceilLights=[],glowMats=[],people=[],obst=[],winMats=[],bldMats=[];

function tex(w,h,fn,rep){
 const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=window.novaAnisotropy||2;
 if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}
 return t;
}

function startNOVA(){
 const host=document.getElementById("scene");
 const mobile=matchMedia("(max-width: 900px)").matches;
 const lowEnd=mobile||((navigator.hardwareConcurrency||4)<=4)||((navigator.deviceMemory||4)<=3);
 window.novaLowEnd=lowEnd;
 scene3=new THREE.Scene();cur=scene3;
 scene3.background=new THREE.Color(0x101c2b);
 scene3.fog=new THREE.Fog(0x101c2b,22,60);
 camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,160);
 camera.rotation.order="YXZ";
 // Native WebGL antialiasing smooths room edges during camera rotation.
 // Mobile performance is protected by the existing conservative pixel-ratio cap.
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 window.novaAnisotropy=Math.min(lowEnd?2:4,renderer.capabilities.getMaxAnisotropy());
 window.pr=Math.min(devicePixelRatio||1,lowEnd?1.15:1.5);renderer.setPixelRatio(window.pr);
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputEncoding=THREE.sRGBEncoding;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 renderer.shadowMap.enabled=true;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 host.innerHTML="";host.appendChild(renderer.domElement);
 const eq=tex(512,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#5a6f86");gr.addColorStop(.5,"#8fa0b2");gr.addColorStop(1,"#2a2f38");g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle="#fff";for(let i=0;i<8;i++)g.fillRect(i*64+10,30,40,14)});
 eq.mapping=THREE.EquirectangularReflectionMapping;
 const pmrem=new THREE.PMREMGenerator(renderer);scene3.environment=pmrem.fromEquirectangular(eq).texture;pmrem.dispose();eq.dispose();

 const M=(c,r=.7,m=0,x)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},x||{}));
 function box(w,h,d,x,y,z,m,cs=true){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);o.castShadow=cs;o.receiveShadow=true;cur.add(o);return o;
 }
 function plane(w,h,x,y,z,map,ry=0,rx=0){
  const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map}));
  o.position.set(x,y,z);o.rotation.y=ry;o.rotation.x=rx;cur.add(o);return o;
 }
 function light(c,i,x,y,z,d){const l=new THREE.PointLight(c,i,d);l.position.set(x,y,z);scene3.add(l);return l}

 // textures
 const floorTex=tex(256,256,(g,w,h)=>{
  g.fillStyle="#b9b2a6";g.fillRect(0,0,w,h);for(let i=0;i<6;i++){g.strokeStyle="rgba(90,80,70,.25)";g.lineWidth=1;g.beginPath();g.moveTo(Math.random()*w,0);g.bezierCurveTo(Math.random()*w,h*.3,Math.random()*w,h*.6,Math.random()*w,h);g.stroke()}
  for(let i=0;i<1800;i++){g.fillStyle="rgba(255,255,255,"+Math.random()*.05+")";g.fillRect(Math.random()*w,Math.random()*h,2,2)}
  g.strokeStyle="#6d675e";g.lineWidth=4;g.strokeRect(0,0,w,h);
 },[7,6.5]);
 const woodTex=tex(256,256,(g,w,h)=>{
  g.fillStyle="#704b32";g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){g.strokeStyle="rgba("+(i%2?"40,20,10":"150,100,60")+",.22)";g.lineWidth=1+Math.random()*2;
   const y=Math.random()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w/3,y+8,w*.6,y-8,w,y+3);g.stroke()}
 });
 const fabT=tex(64,64,(g,w,h)=>{g.fillStyle="#e4e4e4";g.fillRect(0,0,w,h);for(let i=0;i<w;i+=2){g.fillStyle="rgba(0,0,0,.08)";g.fillRect(i,0,1,h);g.fillRect(0,i,w,1)}for(let i=0;i<300;i++){g.fillStyle="rgba(0,0,0,"+Math.random()*.08+")";g.fillRect(Math.random()*w,Math.random()*h,1,1)}},[6,6]);
 const leafT=tex(64,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#7fcf8a");gr.addColorStop(1,"#2c7a4f");g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle="rgba(20,60,30,.5)";g.lineWidth=2;g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.stroke();for(let y=10;y<h;y+=14){g.beginPath();g.moveTo(w/2,y);g.lineTo(4,y+10);g.moveTo(w/2,y);g.lineTo(w-4,y+10);g.stroke()}});
 const asT=tex(128,128,(g,w,h)=>{g.fillStyle="#9aa0a8";g.fillRect(0,0,w,h);for(let i=0;i<1500;i++){g.fillStyle="rgba("+(Math.random()<.5?"0,0,0":"255,255,255")+","+Math.random()*.12+")";g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[24,18]);
 const rugTex=tex(256,256,(g,w,h)=>{
  g.fillStyle="#8a2f4a";g.fillRect(0,0,w,h);
  g.strokeStyle="#c29a63";g.lineWidth=6;g.strokeRect(10,10,w-20,h-20);
  g.strokeStyle="#e8b04a";g.lineWidth=2;for(let i=30;i<110;i+=14)g.strokeRect(i,i,w-2*i,h-2*i);
 });
 const logoTex=tex(512,288,(g,w,h)=>{
  g.fillStyle="#0b2035";g.fillRect(0,0,w,h);
  g.strokeStyle="rgba(85,202,255,.12)";for(let i=0;i<w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke()}
  for(let i=0;i<h;i+=32){g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}
  g.textAlign="center";g.fillStyle="#9cecff";g.font="bold 56px Arial";g.fillText("NOVA",w/2,236);
  g.fillStyle="#6fa8c6";g.font="16px Arial";g.fillText("H E A D Q U A R T E R S",w/2,264);
 });
 const deskLogo=tex(256,64,(g,w,h)=>{g.fillStyle="#1a2a3a";g.fillRect(0,0,w,h);g.fillStyle="#d9b27a";g.font="bold 34px Arial";g.textAlign="center";g.fillText("NOVA",w/2,44)});
 const scrTex=tex(128,80,(g,w,h)=>{
  g.fillStyle="#0e2a44";g.fillRect(0,0,w,h);
  for(let i=0;i<9;i++){g.fillStyle=["#4cbce9","#7ef0bb","#c29a63"][i%3];g.fillRect(8+(i%3)*6,8+i*7,20+Math.random()*70,3)}
 });
 const art=[0,1].map(k=>tex(128,160,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,k?"#ffb347":"#2ec4b6");gr.addColorStop(1,k?"#c2185b":"#3d5a99");
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<6;i++){g.fillStyle="rgba(255,255,255,"+(.08+Math.random()*.15)+")";g.beginPath();g.arc(Math.random()*w,Math.random()*h,15+Math.random()*35,0,7);g.fill()}
 }));
 const clockC=document.createElement("canvas");clockC.width=clockC.height=256;clockCtx=clockC.getContext("2d");
 clockTex=new THREE.CanvasTexture(clockC);clockTex.encoding=THREE.sRGBEncoding;
 clockTex=new THREE.CanvasTexture(clockC);clockTex.encoding=THREE.sRGBEncoding;






 // lights
 hemi=new THREE.HemisphereLight(0xcfe6ff,0x7a6a58,.7);scene3.add(hemi);
 mainLight=light(0xffd7a5,.9,0,4,1,25);
 blueLight=light(0x3199df,.8,-5,3,-3,20);
 sun=new THREE.DirectionalLight(0x6f8fd0,.15);sun.position.set(16,6,-1.5);
 sun.castShadow=true;sun.shadow.mapSize.set(window.novaLowEnd?512:1024,window.novaLowEnd?512:1024);
 const sc=sun.shadow.camera;sc.left=-9;sc.right=9;sc.top=9;sc.bottom=-9;sc.far=50;sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
 scene3.add(sun);

 const floorM=M(0xffffff,.16,.15,{map:floorTex,bumpMap:floorTex,bumpScale:.4});
 const wall=M(0x2d6a7a,.85,0,{map:tex(128,128,(g,w,h)=>{g.fillStyle="#e6e6e6";g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle="rgba(0,0,0,"+Math.random()*.06+")";g.fillRect(Math.random()*w,Math.random()*h,2,2)}},[3,2])});
 const wood=M(0xffffff,.55,0,{map:woodTex,bumpMap:woodTex,bumpScale:.3});
 const dark=M(0x101a27,.4);
 const gold=M(0xc29a63,.3,.45);
 const fab=M(0x34506a,.95,0,{map:fabT});
 const glowM=()=>{const m=M(0xfff1d6,.5,0,{emissive:0xffe6bd,emissiveIntensity:1});glowMats.push(m);return m};

 // room shell
 box(14,.25,13,0,-.125,0,floorM);
 box(14,.15,13,0,5.1,0,M(0x1a2838,.9),false);
 box(14,5,.25,0,2.5,-6.5,wall);
 box(14,5,.25,0,2.5,6.5,wall);
 box(.25,5,13,-7,2.5,0,wall);
 // right wall with real window opening
 box(.25,.8,13,7,.4,0,wall);box(.25,.6,13,7,4.7,0,wall);
 box(.25,3.6,2,7,2.6,-5.5,wall);box(.25,3.6,2,7,2.6,5.5,wall);
 const glass=M(0x9ccbe6,.05,.6,{transparent:true,opacity:.16});
 box(.04,3.6,9,6.95,2.6,0,glass,false);
 for(let z=-4.5;z<=4.5;z+=1.5)box(.1,3.6,.07,6.9,2.6,z,gold);
 box(.35,.06,9.2,6.85,.83,0,gold);
 // baseboards
 box(.06,.18,13,-6.86,.09,0,gold);box(13.6,.18,.06,0,.09,-6.35,gold);

 // rear feature wall
 box(9,4.1,.13,0,2.5,-6.25,wood);
 box(8.4,3.7,.1,0,2.5,-6.15,wall);
 for(let x=-4;x<=4;x+=.8)box(.035,3.7,.035,x,2.5,-6.04,gold);
 box(3.8,2.3,.12,0,2.9,-5.95,dark);
 plane(3.4,1.9,0,2.9,-5.885,logoTex);
 ring1=new THREE.Mesh(new THREE.TorusGeometry(.62,.03,8,48),new THREE.MeshBasicMaterial({color:0x55caff}));
 ring2=new THREE.Mesh(new THREE.TorusGeometry(.4,.022,8,48),new THREE.MeshBasicMaterial({color:0xb2edff}));
 core=new THREE.Mesh(new THREE.SphereGeometry(.15,16,12),new THREE.MeshBasicMaterial({color:0x9cecff}));
 ring1.position.set(0,3.2,-5.8);ring2.position.set(0,3.2,-5.78);core.position.set(0,3.2,-5.75);
 
scene3.add(ring1,ring2,core);

// NOVA Presence 8.3: expressive lightweight procedural holographic avatar.
// Kept shadow-free and low-poly for mobile performance.
novaAvatar=new THREE.Group();
novaAvatar.position.set(0,1.12,-4.25);
scene3.add(novaAvatar);

const holoMat=new THREE.MeshStandardMaterial({
 color:0x65dfff,emissive:0x087eae,emissiveIntensity:1.05,
 metalness:.18,roughness:.28,transparent:true,opacity:.58,
 depthWrite:false
});
const holoBright=new THREE.MeshBasicMaterial({
 color:0xa9f1ff,transparent:true,opacity:.82,depthWrite:false
});
const holoDark=new THREE.MeshBasicMaterial({
 color:0x1b9dcc,transparent:true,opacity:.24,wireframe:true,depthWrite:false
});
function holoPart(geo,mat,x,y,z,sx,sy,sz){
 const o=new THREE.Mesh(geo,mat);
 o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.frustumCulled=true;
 novaAvatar.add(o);return o;
}
// Abstract, friendly humanoid silhouette.
holoPart(new THREE.SphereGeometry(.27,14,12),holoMat,0,1.48,0,1,1.08,.82); // head
holoPart(new THREE.CylinderGeometry(.12,.15,.2,10),holoMat,0,1.18,0,1,1,1); // neck
holoPart(new THREE.SphereGeometry(.42,14,10),holoMat,0,.78,0,1.18,.78,.62); // shoulders
holoPart(new THREE.CylinderGeometry(.28,.36,.72,12),holoMat,0,.38,0,1,1,.72); // torso
// Arms are slightly angled inward for a calm, welcoming pose.
novaArmL=holoPart(new THREE.CylinderGeometry(.085,.11,.68,8),holoMat,-.43,.72,0,1,1,1);
novaArmL.rotation.z=-.16;
novaArmR=holoPart(new THREE.CylinderGeometry(.085,.11,.68,8),holoMat,.43,.72,0,1,1,1);
novaArmR.rotation.z=.16;
// Soft luminous face details.
for(const x of [-.105,.105]){
 const eye=holoPart(new THREE.SphereGeometry(.027,8,6),holoBright,x,1.51,.215,1,1,.55);
 novaEyes.push(eye);
}
// A small luminous mouth can gently animate while NOVA is replying.
novaMouth=holoPart(new THREE.TorusGeometry(.075,.009,6,18),holoBright,0,1.37,.22,1,.48,1);
// Fine wireframe contour adds a holographic texture without heavy particles.
const holoWire=new THREE.Mesh(
 new THREE.SphereGeometry(.43,12,8),
 holoDark
);
holoWire.position.set(0,.82,0);holoWire.scale.set(1.12,1.15,.72);
novaAvatar.add(holoWire);

// Floating rings and projection base.
novaAura=new THREE.Mesh(
 new THREE.TorusGeometry(.55,.018,6,40),
 new THREE.MeshBasicMaterial({color:0x36cfff,transparent:true,opacity:.72})
);
novaAura.rotation.x=Math.PI/2;novaAura.position.set(0,.08,0);novaAvatar.add(novaAura);
novaHalo=new THREE.Mesh(
 new THREE.TorusGeometry(.39,.012,6,36),
 new THREE.MeshBasicMaterial({color:0xb1f4ff,transparent:true,opacity:.62})
);
novaHalo.rotation.x=Math.PI/2;novaHalo.position.set(0,.12,0);novaAvatar.add(novaHalo);
const holoBase=new THREE.Mesh(
 new THREE.CylinderGeometry(.48,.58,.055,32),
 new THREE.MeshBasicMaterial({color:0x147fa9,transparent:true,opacity:.28})
);
holoBase.position.y=.025;novaAvatar.add(holoBase);
novaLight=new THREE.PointLight(0x36cfff,.48,4);

 function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*.001;
  ring1.rotation.z+=.006;ring2.rotation.z-=.009;
  core.scale.setScalar(1+Math.sin(t*2)*.08);
  if(novaAvatar){
   novaAvatar.position.y=1.12+Math.sin(t*1.15)*.035;
   novaAvatar.rotation.y=Math.sin(t*.42)*.055;
   novaAura.rotation.z=t*.34;
   novaHalo.rotation.z=-t*.52;

   // Natural periodic blink: a brief, smooth vertical eye compression.
   const blinkPhase=t%5.1;
   const blink=blinkPhase>4.88;
   const blinkScale=blink?Math.max(.08,Math.abs(blinkPhase-4.985)/.105):1;
   novaEyes.forEach(eye=>{eye.scale.y=.55*blinkScale});

   // Small arm sway keeps the hologram from looking completely static.
   if(novaArmL)novaArmL.rotation.z=-.16+Math.sin(t*1.05)*.025;
   if(novaArmR)novaArmR.rotation.z=.16-Math.sin(t*1.05+.35)*.025;

   const speaking=performance.now()<novaSpeakingUntil;
   if(novaMouth)novaMouth.scale.y=speaking ? .9+Math.abs(Math.sin(t*13))*.8 : .48;
   holoMat.emissiveIntensity=(novaActive||speaking?1.48:1.0)+Math.sin(t*2.1)*.12;
   holoBright.opacity=(novaActive||speaking) ? .96 : .76;
   novaLight.intensity=((novaActive||speaking) ? .78 : .42)+Math.sin(t*2)*.08;
  }
  if(window.dust&&((fpsFrames&1)===0)){const a=window.dust.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i+1]+=.0006+Math.sin(t+i)*.0003;a[i]+=Math.sin(t*.3+i)*.0005;if(a[i+1]>4.6)a[i+1]=.3}window.dust.geometry.attributes.position.needsUpdate=true}
  if(Math.floor(t)!==lastSec){lastSec=Math.floor(t);drawClock()}
  fpsFrames++;const nw=performance.now();if(!fpsStamp)fpsStamp=nw;
   if(nw-fpsStamp>=3000){
    const fps=fpsFrames*1000/(nw-fpsStamp);fpsFrames=0;fpsStamp=nw;
    if(fps<27){
     lowFpsCount++;
     if(window.pr>.76){window.pr=Math.max(.76,window.pr-.15);renderer.setPixelRatio(window.pr);renderer.setSize(innerWidth,innerHeight)}
     else if(lowFpsCount>=2){renderer.shadowMap.enabled=false;if(window.dust)window.dust.visible=false}
    }else if(fps>48){lowFpsCount=Math.max(0,lowFpsCount-1)}
   }
   renderer.render(scene3,camera);
 }
 animate();
}

function drawClock(){
 const g=clockCtx,d=new Date();
 g.clearRect(0,0,256,256);
 g.fillStyle="#0b1a2a";g.beginPath();g.arc(128,128,126,0,7);g.fill();
 g.strokeStyle="#c29a63";g.lineWidth=8;g.stroke();
 for(let i=0;i<12;i++){const a=i*Math.PI/6;g.lineWidth=i%3?3:6;g.strokeStyle="#9cecff";g.beginPath();g.moveTo(128+Math.sin(a)*104,128-Math.cos(a)*104);g.lineTo(128+Math.sin(a)*116,128-Math.cos(a)*116);g.stroke()}
 const hand=(a,l,w,c)=>{g.strokeStyle=c;g.lineWidth=w;g.lineCap="round";g.beginPath();g.moveTo(128,128);g.lineTo(128+Math.sin(a)*l,128-Math.cos(a)*l);g.stroke()};
 hand(((d.getHours()%12)+d.getMinutes()/60)*Math.PI/6,60,8,"#eaf4ff");
 hand((d.getMinutes()+d.getSeconds()/60)*Math.PI/30,88,5,"#eaf4ff");
 hand(d.getSeconds()*Math.PI/30,98,2,"#ff7777");
 clockTex.needsUpdate=true;
 document.getElementById("clockTxt").textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" · DEMO";
}

function lookAt(x,y,z){
 const d=new THREE.Vector3(x-camera.position.x,y-camera.position.y,z-camera.position.z).normalize();
 yaw=Math.atan2(-d.x,-d.z);pitch=Math.asin(d.y);camera.rotation.set(pitch,yaw,0);
}
function moveTo(x,y,z,tx,ty,tz){camera.position.set(x,y,z);lookAt(tx,ty,tz)}

function walk(f,s){
 if(!camera)return;
 const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const px=camera.position.x,pz=camera.position.z;
 let nx=px+dir.x*f+right.x*s,nz=pz+dir.z*f+right.z*s;
 nx=Math.max(-5.7,Math.min(6.2,nx));nz=Math.max(-5.6,Math.min(5.6,nz));
 const hit=(x,z)=>obst.some(o=>x>o[0]&&x<o[1]&&z>o[2]&&z<o[3]);
 if(!hit(nx,nz)){camera.position.x=nx;camera.position.z=nz}
 else if(!hit(nx,pz))camera.position.x=nx;
 else if(!hit(px,nz))camera.position.z=nz;
}

document.addEventListener("pointerdown",e=>{if(!e.target.closest("#scene"))return;dragging=true;lastX=e.clientX;lastY=e.clientY});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointercancel",()=>dragging=false);
addEventListener("pointermove",e=>{
 if(!dragging||!camera)return;
 yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.004;
 lastX=e.clientX;lastY=e.clientY;pitch=Math.max(-1.2,Math.min(1.2,pitch));camera.rotation.set(pitch,yaw,0);
});
addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 const k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w")walk(.35,0);
 if(k==="arrowdown"||k==="s")walk(-.35,0);
 if(k==="arrowleft"||k==="a")walk(0,-.35);
 if(k==="arrowright"||k==="d")walk(0,.35);
 if(k==="h")toggleHUD();if(k==="c")toggleChat();
});

}
function sendMessage(){
